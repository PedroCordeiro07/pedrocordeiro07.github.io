<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedro Cordeiro</title>
    <link rel="icon" href="images/icon.jpeg">

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <!--import dos ícones do bootstrap-->

    <!--import do CSS bootstrap-->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <link rel="stylesheet" href="style.css">

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    
</head>
<body>
    <header class="hero">
        <img class="hero-picture" src="images/pfp.jpeg">
        <h1>
            Pedro Cordeiro
        </h1>
    </header>

    <section class="carousel-container">
      <div class="carousel-title">
        <h2>Projetos</h2>
        <p class="carousel-subtitle">Conheça um pouco do meu trabalho.</p>
      </div>

      <div
        id="carouselExampleAutoplaying"
        class="carousel slide"
        data-bs-ride="carousel"
      >
        <div class="carousel-indicators">
          <button
            type="button"
            data-bs-target="#carouselExampleIndicators"
            data-bs-slide-to="0"
            class="active"
            aria-current="true"
            aria-label="Slide 1"
          ></button>
          <button
            type="button"
            data-bs-target="#carouselExampleIndicators"
            data-bs-slide-to="1"
            aria-label="Slide 2"
          ></button>
          <button
            type="button"
            data-bs-target="#carouselExampleIndicators"
            data-bs-slide-to="2"
            aria-label="Slide 3"
          ></button>
          <button
            type="button"
            data-bs-target="#carouselExampleIndicators"
            data-bs-slide-to="3"
            aria-label="Slide 4"
          ></button>
          
        </div>

        <div class="carousel-inner">

            <!--Site Amazon-->
            <div class="carousel-item active">
                <a href="https://pedrocordeiro07.github.io/amazon/" target="_blank">
                <img
                    class="carousel-image"
                    src="./carousel-slides/site-amazon.png"
                    class="d-block w-100"
                    alt="..."
                />
                </a>
                <div class="carousel-caption">
                <h5>Site Amazon</h5>
                <p>Site Amazon</p>
                </div>
            </div>

            <!--Exercicios JS-->
            <div class="carousel-item active">
                <a href="https://pedrocordeiro07.github.io/javascript/">
                <img
                    class="carousel-image"
                    src="./carousel-slides/javascript.png"
                    class="d-block w-100"
                    alt="..."
                />
                </a>
                <div class="carousel-caption">
                <h5>JavaScript</h5>
                <p>Manipulação de DOM com JavaScript</p>
                </div>
            </div>


            <!--Site Fatec-->
            <div class="carousel-item active">
                <a href="https://pedrocordeiro07.github.io/sitefatec/" target="_blank">
                <img
                    class="carousel-image"
                    src="./carousel-slides/site-fatec.png"
                    class="d-block w-100"
                    alt="..."
                />
                </a>
                <div class="carousel-caption">
                <h5>Fatec Zona Leste</h5>
                <p>Página informativa sobre a grade de aulas do curso de DSM</p>
                </div>
            </div>

            <!--Site SPFC-->
            <div class="carousel-item active">
                <a href="https://pedrocordeiro07.github.io/sitespfc/" target="_blank">
                <img
                    class="carousel-image"
                    src="./carousel-slides/site-spfc.png"
                    class="d-block w-100"
                    alt="..."
                />
                </a>
                <div class="carousel-caption">
                <h5>São Paulo Futebol Clube</h5>
                <p>Página informativa sobre o clube.</p>
                </div>
            </div>

          
            <div class="carousel-buttons">
              <button
                class="carousel-control-prev"
                type="button"
                data-bs-target="#carouselExampleAutoplaying"
                data-bs-slide="prev"
                >
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Previous</span>
                </button>

                <button
                    class="carousel-control-next"
                    type="button"
                    data-bs-target="#carouselExampleAutoplaying"
                    data-bs-slide="next"
                    >
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                </button>
            </div>

        </div>
    </section>
    
</body>
</html>
